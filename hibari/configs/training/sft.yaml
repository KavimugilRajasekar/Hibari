# TEMPLATE — continued training / full-parameter fine-tuning from existing weights.
# LoRA is NOT implemented in the engine yet (src/hibari/training/fine_tuning.py is a
# placeholder), so this template fine-tunes all parameters. init_checkpoint must
# exist: the Koto trainer refuses to fall back to random weights.
experiment: EXP-XXXX
model_version: 0.0.1
init_checkpoint: checkpoints/<model>_X.Y.Z/best_model.pt
data_cache_dir: data/processed_X.Y.Z
val_examples: 5000
learning_rate: 3.0e-4           # lower than from-scratch to limit forgetting
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 200
max_steps: 5000
batch_size: 32
gradient_accumulation_steps: 1
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
output_dir: checkpoints/<model>_X.Y.Z_ft
save_best: true
overwrite_output_dir: false
early_stopping_patience: 4
max_hours: 3.0
seed: 42
